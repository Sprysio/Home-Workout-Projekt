name: Build & Deploy Changed Services

on:
  push:
    branches: [main]

env:
  REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Figure out which services changed
  # ─────────────────────────────────────────────────────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      any_changed: ${{ steps.set-matrix.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # need previous commit to diff against

      - name: Detect changed services
        id: set-matrix
        run: |
          # Map: directory name → docker image name
          declare -A SERVICE_MAP=(
            ["frontend"]="homew-frontend"
            ["api-gateway"]="homew-gateway"
            ["auth-service"]="homew-auth"
            ["workout-service"]="homew-workout"
            ["exercise-service"]="homew-exercise"
          )

          CHANGED=()

          for DIR in "${!SERVICE_MAP[@]}"; do
            if git diff --name-only HEAD~1 HEAD | grep -q "^${DIR}/"; then
              IMAGE="${SERVICE_MAP[$DIR]}"
              CHANGED+=("{\"service\":\"${DIR}\",\"image\":\"${IMAGE}\"}")
              echo "Changed: ${DIR} → ${IMAGE}"
            fi
          done

          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "No service directories changed."
            echo "any_changed=false" >> $GITHUB_OUTPUT
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
          else
            MATRIX_JSON=$(IFS=,; echo "[${CHANGED[*]}]")
            echo "any_changed=true" >> $GITHUB_OUTPUT
            echo "matrix={\"include\":${MATRIX_JSON}}" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build & push only the changed services (parallel matrix)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false            # build others even if one fails

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ matrix.image }}:${{ steps.sha.outputs.short }}
            ${{ env.DOCKER_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,scope=${{ matrix.service }},mode=max


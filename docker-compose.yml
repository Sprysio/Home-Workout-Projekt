version: '3.8'

services:
  frontend:
    image: sprysio/homew-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - public

  api-gateway:
    image: sprysio/homew-gateway:latest
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - workout-service
      - exercise-service
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AUTH_SERVICE_HOST=auth-service
      - WORKOUT_SERVICE_HOST=workout-service
      - EXERCISE_SERVICE_HOST=exercise-service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_BASE64=${JWT_SECRET_BASE64}
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    networks:
      - public
      - services
      - cache

  auth-service:
    image: sprysio/homew-auth:latest
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=appdb
      - DB_USER=appuser
      - DB_PASSWORD=secret
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - services
      - data

  workout-service:
    image: sprysio/homew-workout:latest
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=appdb
      - DB_USER=appuser
      - DB_PASSWORD=secret
      - JWT_SECRET=${JWT_SECRET}
      - EXERCISE_SERVICE_URL=http://exercise-service:8080/api/exercises/
    networks:
      - services
      - data
  exercise-service:
    image: sprysio/homew-exercise:latest
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=appdb
      - DB_USER=appuser
      - DB_PASSWORD=secret
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - services
      - data
  postgres:
    image: postgres:15
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - data

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cache

volumes:
  postgres_data:

networks:
  public:
    driver: bridge
  services:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true
  cache:
    driver: bridge
    internal: true
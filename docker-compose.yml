version: '3.8'

services:
  frontend:
    image: sprysio/homew-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - public

  api-gateway:
    image: sprysio/homew-gateway:latest
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - workout-service
      - exercise-service
      - redis
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - public
      - services
      - cache

  auth-service:
    image: sprysio/homew-auth:latest
    depends_on:
      - postgres
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - services
      - data

  workout-service:
    image: sprysio/homew-workout:latest
    depends_on:
      - postgres
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
      - DB_PORT=5432
    networks:
      - services
      - data

  exercise-service:
    image: sprysio/homew-exercise:latest
    depends_on:
      - postgres
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
      - DB_PORT=5432
    networks:
      - services
      - data

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - data

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - cache

volumes:
  postgres_data:

networks:
  public:
    driver: bridge
  services:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true
  cache:
    driver: bridge
    internal: true
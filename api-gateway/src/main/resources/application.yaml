spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  cloud:
    gateway:
      server:
        webflux:
          # Global CORS is handled by CorsConfig bean — disable built-in to avoid conflicts
          globalcors:
            add-to-simple-url-handler-mapping: false

          routes:
            # ── AUTH SERVICE ───────────────────────────────────────────────────
            # Public: login & register — no JWT required
            - id: auth-public
              uri: http://${AUTH_SERVICE_HOST}:8080
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"

            # ── WORKOUT SERVICE ────────────────────────────────────────────────
            - id: workout-service
              uri: http://${WORKOUT_SERVICE_HOST}:8080
              predicates:
                - Path=/api/workout/**
              filters:
                - Auth                    # JWT verification
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@userKeyResolver}"

            # ── EXERCISE SERVICE ───────────────────────────────────────────────
            - id: exercise-public-list
              uri: http://${EXERCISE_SERVICE_HOST}:8080
              predicates:
                - Path=/api/exercise/exercises
                - Method=GET
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@userKeyResolver}"

            - id: exercise-public-one
              uri: http://${EXERCISE_SERVICE_HOST}:8080
              predicates:
                - Path=/api/exercise/exercises/*
                - Method=GET
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@userKeyResolver}"

            - id: exercise-service
              uri: http://${EXERCISE_SERVICE_HOST}:8080
              predicates:
                - Path=/api/exercise/**
              filters:
                - Auth                    # JWT verification
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@userKeyResolver}"

jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-details: always

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: docker

  data:
    redis:
      host: redis
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          trusted-proxies: ".*"   # trust all proxies inside docker network